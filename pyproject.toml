[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shared-agent-memory"
version = "0.1.0"
description = "Self-hosted, source-linked memory across agent sessions"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "mcp>=1.20,<2",
  "psycopg[binary,pool]>=3.2,<4", "pydantic-settings>=2.7,<3",
  "alembic>=1.14,<2", "sqlalchemy>=2.0,<3", "httpx>=0.28,<1",
]

[project.scripts]
shared-memory = "shared_memory.cli:main"
shared-memory-hook = "shared_memory.hook:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/shared_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
